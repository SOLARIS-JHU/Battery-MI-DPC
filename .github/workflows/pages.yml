name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scripts and website
        run: |
          node --check website/main.js
          node website/scripts/validate.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HTML and SVG XML
        run: |
          pip install html5validator==0.4.2
          html5validator --root website
          python -c "import pathlib,xml.etree.ElementTree as E; files=list(pathlib.Path('website/static').rglob('*.svg')); [E.parse(p) for p in files]; print(f'{len(files)} SVG files parsed')"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed page and core assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(base, timeout=30) as response:
                      page = response.read().decode()
                  assert 'End-to-End Battery Dispatch' in page
                  for asset in ['style.css', 'main.js', 'static/og.png', 'static/figures/graphical-abstract-animated.svg', 'static/figures/hybrid-gradient.svg', 'static/figures/lambda-sensitivity.svg', 'static/figures/feasibility-projection.svg', 'static/vendor/katex/katex.min.js']:
                      with urllib.request.urlopen(base + asset, timeout=30) as response:
                          assert response.status == 200 and response.read(32)
                  print('Live page and core assets verified:', base)
                  break
              except Exception as error:
                  if attempt == 5:
                      raise
                  print('Retry:', error)
                  time.sleep(20)
          PY
